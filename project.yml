name: openmxc
options:
  bundleIdPrefix: com.openmxc
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  openmxc:
    type: application
    platform: macOS
    sources:
      - path: openmxc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openmxc.browser
        PRODUCT_NAME: openmxc
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        INFOPLIST_KEY_CFBundleDisplayName: OPENMXC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: openmxc/OpenMxc.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  openmxcTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: openmxcTests
    dependencies:
      - target: openmxc
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/openmxc.app/Contents/MacOS/openmxc"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  openmxc:
    build:
      targets:
        openmxc: all
        openmxcTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - openmxcTests
